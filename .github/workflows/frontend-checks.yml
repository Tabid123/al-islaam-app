name: Frontend Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unmatched delivery regression tests
        run: node --experimental-strip-types --test tests/unmatchedDelivery.test.mjs

      - name: Build frontend
        run: bun run build
